name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}
                 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libgl1-mesa-glx was removed in Ubuntu 24.04; libgl1 provides libGL.
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Run flake8
        run: flake8 phoniebox_installer/ tests/

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen   # headless CI: Qt braucht kein Display
        run: pytest -v --cov=phoniebox_installer --cov-report=term

  build-appimage:
    # The real AppImage build runs in a Debian 12 container: deterministic
    # and independent of the runner image. The containerized build is used
    # ONLY in CI here; building build_appimage.sh locally uses the
    # developer's own system.
    name: Build AppImage (container)
    runs-on: ubuntu-24.04
    container: debian:12
    needs: test

    steps:
      # git must be installed before actions/checkout can run in the container.
      # `file` is required by appimagetool (it inspects the built binary).
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git wget ca-certificates patchelf binutils file curl \
            libglib2.0-0 libfontconfig1 libdbus-1-3 libsystemd0 \
            libxkbcommon0 libgl1 libegl1

      - uses: actions/checkout@v5

      - name: Create venv and install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.14
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Build AppImage
        env:
          # appimagetool is itself an AppImage; containers have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash packaging/linux/build_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoniebox-installer-appimage
          path: Phoniebox-Installer-*.AppImage
          retention-days: 14
