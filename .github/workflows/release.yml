name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name phoniebox-installer phoniebox_installer/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoniebox-installer-${{ matrix.os }}
          path: dist/
